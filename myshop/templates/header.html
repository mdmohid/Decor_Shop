<nav class="navbar is-light">
  <div class="container">
    <div class="navbar-brand">
      <a class="navbar-item" href="{% url 'home' %}">
        <strong>Decor Shop</strong>
      </a>
    </div>

    <div class="navbar-menu is-active">
      <div class="navbar-start">
        <a class="navbar-item" href="{% url 'home' %}"> Home </a>

        <a class="navbar-item" href="{% url 'products'%}"> Products </a>

        {% comment %} <a class="navbar-item" href="#"> Categories </a> {% endcomment %}
        <div class="navbar-item has-dropdown is-hoverable">
        
            <a class="navbar-link">
                Categories
            </a>
        
            <div class="navbar-dropdown">
        
                {% for category in categories %}
                    <a class="navbar-item"
                       href="{% url 'products' %}?category={{ category.slug }}">
                        {{ category.name }}
                    </a>
                {% endfor %}
        
            </div>
        
        </div>

        <a class="navbar-item" href="{% url 'cart' %}"> Cart </a>
      </div>

      <div class="navbar-end">
        {% if user.is_authenticated %} {% comment %}
        <div class="navbar-item">{{ user.username }}</div>
        {% endcomment %}
        <a class="navbar-item" href="{% url 'profile' %}">
          {{ user.username }}
        </a>

        <a class="navbar-item" href="{% url 'logout' %}"> Logout </a>

        {% else %}

        <a class="navbar-item" href="{% url 'login' %}"> Login </a>

        <a class="navbar-item" href="{% url 'register' %}"> Register </a>

        {% endif %}
      </div>
    </div>
  </div>
</nav>
